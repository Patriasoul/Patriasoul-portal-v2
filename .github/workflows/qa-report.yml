name: PatriaSoul · QA izvještaj

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-report:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v6
      - name: Postavi Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Izradi izvještaj kvalitete
        run: node scripts/qa/qa-report.js
      - name: Pohrani izvještaj
        uses: actions/upload-artifact@v4
        with:
          name: patriasoul-qa-report
          path: |
            qa-report/report.md
            qa-report/report.json
          retention-days: 14
