name: PatriaSoul · DHMZ podaci

on:
  push:
    paths:
      - ".github/workflows/dhmz.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: patriasoul-dhmz-main
  cancel-in-progress: false

jobs:
  update-dhmz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Preuzmi DHMZ upozorenja i tekstualne podatke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          SOURCES = {
              "today": "https://meteo.hr/upozorenja/cap_hr_today.xml",
              "tomorrow": "https://meteo.hr/upozorenja/cap_hr_tmorrow.xml",
              "day_after_tomorrow": "https://meteo.hr/upozorenja/cap_hr_day_after_tomorrow.xml",
              "rainfall": "https://vrijeme.hr/oborina.xml",
              "adriatic": "https://prognoza.hr/jadran_h.xml",
              "sailors": "https://prognoza.hr/pomorci.xml",
              "croatia_forecast": "https://prognoza.hr/prognoza_danas.xml",
          }

          def download(url):
              req = urllib.request.Request(url, headers={"User-Agent": "PatriaSoul-DHMZ/1.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read()

          def leaf_texts(root):
              out = []
              for node in root.iter():
                  if len(list(node)) == 0 and node.text:
                      value = " ".join(node.text.split())
                      if value and value not in out:
                          out.append(value)
              return out

          def useful_text(url):
              try:
                  root = ET.fromstring(download(url))
                  values = leaf_texts(root)
                  sentences = []
                  for value in values:
                      if len(value) >= 45 and value not in sentences:
                          sentences.append(value)
                  return sentences[:20]
              except Exception as exc:
                  print(f"Upozorenje: {url}: {exc}")
                  return []

          warnings = []
          for key in ("today", "tomorrow", "day_after_tomorrow"):
              try:
                  root = ET.fromstring(download(SOURCES[key]))
                  for info in root.findall(".//{*}info"):
                      def text(name):
                          node = info.find(".//{*}" + name)
                          return (node.text or "").strip() if node is not None else ""
                      areas = []
                      for node in info.findall(".//{*}areaDesc"):
                          value = " ".join((node.text or "").split())
                          if value and value not in areas:
                              areas.append(value)
                      event = text("event")
                      description = text("description")
                      severity = text("severity")
                      urgency = text("urgency")
                      if event or description or areas:
                          warnings.append({
                              "day": key,
                              "event": event,
                              "description": description,
                              "severity": severity,
                              "urgency": urgency,
                              "areas": areas
                          })
              except Exception as exc:
                  print(f"Upozorenje CAP {key}: {exc}")

          unique = []
          seen = set()
          for item in warnings:
              if item.get("event","").lower().startswith("green") or item.get("description","").lower().startswith("no warnings"):
                  continue
              key = (item.get("day"), item.get("event",""), item.get("description",""), tuple(item.get("areas",[])))
              if key not in seen:
                  seen.add(key)
                  unique.append(item)

          payload = {
              "source": "DHMZ",
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "warnings": unique,
              "rainfall_text": useful_text(SOURCES["rainfall"]),
              "adriatic_text": useful_text(SOURCES["adriatic"]),
              "sailors_text": useful_text(SOURCES["sailors"]),
              "croatia_forecast_text": useful_text(SOURCES["croatia_forecast"])
          }

          with open("data/dhmz-data.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Provjeri DHMZ paket
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          with open("data/dhmz-data.json", encoding="utf-8") as f:
              data=json.load(f)
          assert data.get("source") == "DHMZ"
          assert "warnings" in data
          assert "rainfall_text" in data
          assert "adriatic_text" in data
          print("DHMZ upozorenja:", len(data["warnings"]))
          print("DHMZ oborina tekstova:", len(data["rainfall_text"]))
          print("DHMZ Jadran tekstova:", len(data["adriatic_text"]))
          print("Ažurirano:", data["updated_at"])
          PY

      - name: Spremi nove DHMZ podatke
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PatriaSoul Bot"
          git config user.email "patriasoul@protonmail.com"
          git add data/dhmz-data.json
          if git diff --cached --quiet -- data/dhmz-data.json; then
            echo "Nema promjene DHMZ podataka."
            exit 0
          fi
          git commit -m "DHMZ: osvježi meteorološke podatke [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
