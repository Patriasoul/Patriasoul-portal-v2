name: PatriaSoul · Objavljivanje portala

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  workflow_run:
    workflows:
      - "PatriaSoul · Na današnji dan"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Provjeri sintaksu Cloudflare Workera
        run: node --check worker.js

      - name: Izradi javne HTML stranice za objavljene CMS članke
        run: node scripts/build/generate-cms-articles.js

      - name: Normaliziraj članke
        run: node scripts/build/normalize-articles.js

      - name: Sinkroniziraj indeks članaka u repozitorij
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          if git diff --cached --quiet; then
            echo "Indeks članaka nije promijenjen."
          else
            git commit -m "Ažuriraj indeks članaka [skip ci]"
            git push origin HEAD:main
          fi

      - name: Ujednaci portal shell na svim HTML stranicama
        run: node scripts/build/normalize-shell.js

      - name: Primijeni automatski SEO na portal
        run: node scripts/build/enrich-seo.js

      - name: Generiraj sitemap, robots i indeks pretrage
        run: node scripts/build/generate-discovery.js

      - name: QA strukture
        run: node scripts/qa/qa-structure.js

      - name: QA članaka
        run: node scripts/qa/qa-articles.js

      - name: QA sustava članaka
        run: node scripts/qa/qa-article-system.js

      - name: QA slika
        run: node scripts/qa/qa-images.js

      - name: Dijagnostika verzije i vremenske stranice
        shell: bash
        run: |
          set -euo pipefail
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "vrijeme.html CSS link:"
          grep -n "weather-page.css" stranice/vrijeme.html || true
          echo "weather-page.css:"
          test -f assets/css/weather-page.css && echo "POSTOJI" || (echo "NEDOSTAJE"; exit 1)

      - name: QA sitemap i robots
        run: node scripts/qa/qa-discovery.js


      - name: QA komentara i prijave
        run: node scripts/qa/qa-comments.js

      - name: QA administracije i RSS
        run: node scripts/qa/qa-admin.js

      - name: Build Hrvatski kviz
        working-directory: kviz
        run: |
          npm install
          npm run build

      - name: Prepare Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='_site' --exclude='kviz/dist' ./ _site/
          rm -rf _site/kviz
          mkdir -p _site/kviz
          cp -R kviz/dist/. _site/kviz/

      - name: Provjeri glavne kategorije u izgrađenom portalu
        shell: bash
        run: |
          set -euo pipefail
          for category in domovina povijest vjera cuvari-nasljedja; do
            file="_site/kategorije/$category/index.html"
            if [ ! -s "$file" ]; then
              echo "::error::Nedostaje glavna stranica kategorije: $file"
              exit 1
            fi
            echo "OK $file"
          done

      - name: Postavi službeni PatriaSoul favicon na cijeli portal
        run: node scripts/build/ensure-favicon.js _site

      - name: QA poveznica na izgrađenom portalu
        run: node scripts/qa/qa-links.js _site

      - name: Probna Wrangler izgradnja bez objave
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Upload Cloudflare Worker assets
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-worker-assets
          path: _site
          if-no-files-found: error
          retention-days: 1

  deploy-cloudflare-worker:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ps.patriasoul.workers.dev/
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository for wrangler config
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Provjeri je li ova objava najnovija
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"
          echo "Run SHA: $GITHUB_SHA"
          echo "Trenutni main: $CURRENT_MAIN"
          if [ "$CURRENT_MAIN" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Ova objava sadrži najnoviju verziju."
          else
            CHANGED_PATHS="$(git diff --name-only "$GITHUB_SHA" "$CURRENT_MAIN")"
            echo "Datoteke promijenjene nakon pokretanja builda:"
            printf '%s\n' "$CHANGED_PATHS"
            # Build smije sam ažurirati samo indeks članaka. Taj bot-commit
            # ne smije blokirati objavu artefakta koji već sadrži taj indeks.
            if [ "$CHANGED_PATHS" = "data/articles.json" ]; then
              echo "current=true" >> "$GITHUB_OUTPUT"
              echo "Nastavljam: jedina novija promjena je automatski indeks članaka."
            else
              echo "current=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Preskačem zastarjelu objavu jer su se druge datoteke promijenile nakon početka builda."
            fi
          fi

      - name: Download built portal assets
        if: steps.freshness.outputs.current == 'true'
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-worker-assets
          path: _site

      - name: Deploy portal to Cloudflare Workers with Wrangler v4
        if: steps.freshness.outputs.current == 'true' && env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test ključnih stranica nakon objave
        if: success() && steps.freshness.outputs.current == 'true' && env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        run: node scripts/qa/qa-live.js
        env:
          BASE_URL: https://ps.patriasoul.workers.dev

      - name: Fail if Cloudflare credentials are missing
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: |
          echo "::error::Nedostaje CLOUDFLARE_API_TOKEN ili CLOUDFLARE_ACCOUNT_ID. Portal nije objavljen na Workers."
          exit 1
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
