name: PatriaSoul · GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Normaliziraj članke
        run: node scripts/build/normalize-articles.js

      - name: Generiraj sitemap, robots i indeks pretrage
        run: node scripts/build/generate-discovery.js

      - name: QA strukture
        run: node scripts/qa/qa-structure.js

      - name: QA članaka
        run: node scripts/qa/qa-articles.js

      - name: QA slika
        run: node scripts/qa/qa-images.js

      - name: QA linkova
        run: node scripts/qa/qa-links.js

      - name: Build Hrvatski kviz
        working-directory: kviz
        run: |
          npm install
          npm run build

      - name: Prepare Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='_site' --exclude='kviz/dist' ./ _site/
          rm -rf _site/kviz
          mkdir -p _site/kviz
          cp -R kviz/dist/. _site/kviz/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
