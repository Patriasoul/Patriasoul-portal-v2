name: PatriaSoul · GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - "PatriaSoul · Na današnji dan"
    types:
      - completed

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Normaliziraj članke
        run: node scripts/build/normalize-articles.js

      - name: Sinkroniziraj indeks članaka u repozitorij
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          if git diff --cached --quiet; then
            echo "Indeks članaka nije promijenjen."
          else
            git commit -m "Ažuriraj indeks članaka [skip ci]"
            git push origin HEAD:main
          fi

      - name: Ujednaci portal shell na svim HTML stranicama
        run: node scripts/build/normalize-shell.js

      - name: Generiraj sitemap, robots i indeks pretrage
        run: node scripts/build/generate-discovery.js

      - name: QA strukture
        run: node scripts/qa/qa-structure.js

      - name: QA članaka
        run: node scripts/qa/qa-articles.js

      - name: QA sustava članaka
        run: node scripts/qa/qa-article-system.js

      - name: QA slika
        run: node scripts/qa/qa-images.js

      - name: Dijagnostika verzije i vremenske stranice
        shell: bash
        run: |
          set -euo pipefail
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "vrijeme.html CSS link:"
          grep -n "weather-page.css" stranice/vrijeme.html || true
          echo "weather-page.css:"
          test -f assets/css/weather-page.css && echo "POSTOJI" || (echo "NEDOSTAJE"; exit 1)

      - name: QA sitemap i robots
        run: node scripts/qa/qa-discovery.js

      - name: QA linkova
        run: node scripts/qa/qa-links.js

      - name: QA komentara i prijave
        run: node scripts/qa/qa-comments.js

      - name: Build Hrvatski kviz
        working-directory: kviz
        run: |
          npm install
          npm run build

      - name: Prepare Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a --exclude='_site' --exclude='kviz/dist' ./ _site/
          rm -rf _site/kviz
          mkdir -p _site/kviz
          cp -R kviz/dist/. _site/kviz/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
