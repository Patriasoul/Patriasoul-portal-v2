name: PatriaSoul · Sinkronizacija baze znanja

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-knowledge.yml"
      - ".github/sync-trigger.txt"
  schedule:
    - cron: "*/30 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sinkroniziraj PatriaSoul članke
        env:
          SUPABASE_URL: https://azerctpwfzdivydsxyex.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          test -n "$SUPABASE_ANON_KEY"
          RESPONSE=$(curl --fail-with-body -sS             -X POST             -H "apikey: $SUPABASE_ANON_KEY"             -H "Authorization: Bearer $SUPABASE_ANON_KEY"             -H "Content-Type: application/json"             "$SUPABASE_URL/functions/v1/sync-patriasoul-knowledge")
          echo "=== PATRIASOUL KNOWLEDGE SYNC ==="
          echo "$RESPONSE"
          echo "=== END SYNC ==="
