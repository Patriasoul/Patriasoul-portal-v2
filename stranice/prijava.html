<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prijava — PatriaSoul</title><link rel="stylesheet" href="../assets/css/base.css"></head><body><main class="ps-page" style="max-width:560px"><p class="ps-kicker">PATRIASOUL</p><h1>Prijava</h1><p>Prijavite se svojim PatriaSoul računom za komentiranje i ostale korisničke mogućnosti.</p><form id="ps-login" style="display:grid;gap:12px;margin-top:24px"><label>E-mail<input id="email" type="email" required autocomplete="email" style="display:block;width:100%;padding:11px"></label><label>Lozinka<input id="password" type="password" required autocomplete="current-password" style="display:block;width:100%;padding:11px"></label><button type="submit" style="padding:11px;background:#17395f;color:#fff;border:0;border-radius:7px;font-weight:800">Prijavi se</button><p id="msg" role="status"></p></form><p>Nemate račun? <a href="registracija.html">Registrirajte se</a></p></main><script src="../assets/js/portal.js"></script><script src="../assets/js/auth.js"></script><script>document.getElementById("ps-login").addEventListener("submit",async e=>{e.preventDefault();const m=document.getElementById("msg");m.textContent="Prijava...";try{const r=await PatriaSoulAuth.signIn(document.getElementById("email").value.trim(),document.getElementById("password").value);if(r.error)throw r.error;const next=new URLSearchParams(location.search).get("next");location.href=next||"../index.html"}catch(err){m.textContent=err.message||"Prijava nije uspjela."}});</script></body></html>
