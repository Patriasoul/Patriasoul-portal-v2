<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prijava — PatriaSoul</title><link rel="stylesheet" href="../assets/css/base.css"></head><body><main class="ps-auth-page"><section class="ps-auth-card"><p class="ps-kicker">PATRIASOUL · KORISNIČKI RAČUN</p><h1>Prijava</h1><p>Prijavite se svojim PatriaSoul računom za komentiranje članaka.</p><form id="ps-login" class="ps-auth-form"><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Lozinka<input id="password" type="password" required autocomplete="current-password"></label><button type="submit">Prijavi se</button><p id="msg" class="ps-auth-message" role="status" aria-live="polite"></p></form><p class="ps-auth-link">Nemate račun? <a href="registracija.html">Registrirajte se</a></p></section></main><script src="../assets/js/portal.js"></script><script src="../assets/js/auth.js"></script><script>document.getElementById("ps-login").addEventListener("submit",async e=>{e.preventDefault();const form=e.currentTarget,m=document.getElementById("msg"),button=form.querySelector("button");m.textContent="Prijava...";button.disabled=true;try{const r=await PatriaSoulAuth.signIn(document.getElementById("email").value.trim(),document.getElementById("password").value);if(r.error)throw r.error;const next=new URLSearchParams(location.search).get("next");location.href=next||"../index.html"}catch(err){m.textContent=err.message||"Prijava nije uspjela.";button.disabled=false}});</script></body></html>
