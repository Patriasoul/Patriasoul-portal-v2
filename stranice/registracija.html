<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registracija — PatriaSoul</title><link rel="stylesheet" href="../assets/css/base.css"></head><body><main class="ps-page" style="max-width:560px"><p class="ps-kicker">PATRIASOUL</p><h1>Registracija</h1><p>Izradite svoj PatriaSoul račun. Račun je potreban za komentiranje članaka.</p><form id="ps-register" style="display:grid;gap:12px;margin-top:24px"><label>Ime za prikaz<input id="name" required minlength="2" maxlength="80" autocomplete="nickname" style="display:block;width:100%;padding:11px"></label><label>E-mail<input id="email" type="email" required autocomplete="email" style="display:block;width:100%;padding:11px"></label><label>Lozinka<input id="password" type="password" required minlength="8" autocomplete="new-password" style="display:block;width:100%;padding:11px"></label><button type="submit" style="padding:11px;background:#17395f;color:#fff;border:0;border-radius:7px;font-weight:800">Registriraj račun</button><p id="msg" role="status"></p></form><p>Već imate račun? <a href="prijava.html">Prijavite se</a></p></main><script src="../assets/js/portal.js"></script><script src="../assets/js/auth.js"></script><script>document.getElementById("ps-register").addEventListener("submit",async e=>{e.preventDefault();const m=document.getElementById("msg");m.textContent="Registracija...";try{const r=await PatriaSoulAuth.signUp(document.getElementById("email").value.trim(),document.getElementById("password").value,document.getElementById("name").value.trim());if(r.error)throw r.error;m.textContent=r.data?.session?"Račun je otvoren.":"Račun je otvoren. Provjerite e-mail ako je potrebna potvrda."; }catch(err){m.textContent=err.message||"Registracija nije uspjela."}});</script></body></html>
